meta:
  name: KhaneYab Persian Housing Search Language Specification
  version: 0.2.0
  status: expanded-language-draft
  language: fa-IR
  purpose: Declarative vocabulary and grammar for converting Persian housing requests into SearchIntent / IntentPatch updates.
    This is designed for KhaneYab's deterministic parser and evidence-aware ranking, not for a general-purpose Persian NLP
    system.
  design_principles:
  - Latest explicit user action wins.
  - A follow-up patch changes only explicitly mentioned fields; absent fields are preserved.
  - A new self-contained search replaces prior SearchIntent constraints.
  - Unknown listing evidence is not equivalent to false.
  - Structured facts outrank text-derived claims when both exist.
  - Text-derived claims must retain evidence wording and should not be presented as verified facts.
  - Hard constraints, soft preferences, and conditional/fallback rules must remain distinguishable.
  - Location intent and workplace context are separate concepts.
  - Manual filters and natural-language requests must synchronize through one canonical SearchIntent.
  - Do not infer sensitive protected characteristics as housing suitability criteria.
  evidence_tiers:
    A: Structured/geo data already suitable for direct filtering or scoring.
    B: Can be extracted from listing title/description as seller/ad evidence; unknown is common.
    C: Parser may understand the request, but current data may be sparse or usually unknown.
  companion_files:
  - SEARCH_LANGUAGE_PHRASE_BANK.yaml
  - SEARCH_LANGUAGE_REGRESSION.yaml
  - COVERAGE_REPORT.md
  v0_2_changes:
  - Expanded colloquial Persian and common spelling variants.
  - Added Tehran-market vocabulary banks.
  - Expanded concept-level synonym/negation/priority phrase families.
  - Expanded difficult compound, conditional, exception and fallback language.
  - Expanded stateful refinement/context-reference coverage.
  - Added explicit evidence-awareness regression language.

  - CONTEXTUAL_PATCH
normalization:
  unicode_replacements:
    ي: ی
    ى: ی
    ك: ک
    ۀ: ه
    ة: ه
  digit_sets:
    persian: ۰۱۲۳۴۵۶۷۸۹
    arabic: ٠١٢٣٤٥٦٧٨٩
    latin: 0123456789
  rules:
  - trim leading/trailing whitespace
  - collapse repeated whitespace
  - treat ZWNJ and normal-space variants as equivalent for matching
  - 'normalize punctuation variants: ؛ ; ، ,'
  - normalize colloquial negatives such as نمیخوام / نمی‌خوام
  - normalize میخوام / می‌خوام and میخام / می‌خوام
  - normalize خوابه / خواب when used after a number
  - normalize تومن / تومان
  - normalize ملیون / میلیون
  number_words:
    صفر: 0
    یک: 1
    یه: 1
    دو: 2
    سه: 3
    چهار: 4
    پنج: 5
    شش: 6
    هفت: 7
    هشت: 8
    نه: 9
    ده: 10
    یازده: 11
    دوازده: 12
    سیزده: 13
    چهارده: 14
    پانزده: 15
    بیست: 20
    سی: 30
    چهل: 40
    پنجاه: 50
    صد: 100
  unit_aliases:
    million_toman:
    - میلیون تومان
    - میلیون تومن
    - میلیون
    - م
    billion_toman:
    - میلیارد تومان
    - میلیارد تومن
    - میلیارد
    square_meter:
    - متر
    - متر مربع
    - مترمربع
    kilometer:
    - کیلومتر
    - کیلو متر
    - km
    meter_distance:
    - متر
    - m
    year:
    - سال
    - ساله
    percent:
    - درصد
    - ٪
    - '%'

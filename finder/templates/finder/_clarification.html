{% if pending_reference.reference == 'conflict' %}<section class="intent-conflict" role="alert"><h2>دو شرط ناسازگار پیدا کردیم</h2><ul>{% for conflict in pending_reference.conflicts %}<li>{{ conflict.message }}</li>{% endfor %}</ul><form method="post" action="{% url 'intent' %}">{% csrf_token %}<label for="conflict-query">خواسته‌ها را روشن‌تر بنویس</label><textarea id="conflict-query" name="query" maxlength="2000" rows="3" required>{{ pending_reference.text }}</textarea><button type="submit" class="primary">ویرایش خواسته‌ها</button><button type="button" class="text-link" data-advanced-open aria-controls="advanced-filters" aria-expanded="false">انتخاب با فیلترها</button></form></section>{% else %}<form method="post" action="{% url 'intent' %}" class="refinement-search" aria-label="تکمیل محدوده جستجو">{% csrf_token %}<input type="hidden" name="action" value="clarify"><label for="reference-place">{% if pending_reference.reference == 'workplace' %}محل کارت رو هنوز نمی‌دونیم. کجا کار می‌کنی؟{% else %}کدوم محله رو می‌گی؟ هنوز محدوده‌ای انتخاب نشده.{% endif %}</label><div class="update-row"><select id="reference-place" name="reference_place" required><option value="">انتخاب محله</option>{% for place in reference_choices %}<option value="{{ place }}">{{ place }}</option>{% endfor %}</select><button class="primary" type="submit">ادامه جستجو</button><button class="text-link" name="cancel" value="1" formnovalidate>لغو</button></div></form>{% endif %}

compound_grammar:
  relative_priority:
    patterns:
    - '{A} از {B} مهم‌تره'
    - '{A} مهم‌تر از {B} است'
    - '{A} رو به {B} ترجیح می‌دم'
    - اولویت {A} بیشتر از {B}ه
    semantics: Increase priority(A) relative to B; do not necessarily make B ignored.
  superlative_priority:
    patterns:
    - '{A} از همه چیز مهم‌تره'
    - '{A} مهم‌ترین چیزه'
    - '{A} اولویت اولمه'
    semantics: Set A to very_high; preserve unrelated fields.
  conditional_requirement:
    patterns:
    - '{A} فقط اگر {B}'
    - اگر {A}، حتماً {B}
    - '{A} باشه ولی {B} لازم دارم'
    - اگه {A} باشه {B} اجباریه
    examples:
    - طبقه چهار به بالا فقط اگر آسانسور داشته باشه
    - اگه ساختمون قدیمیه حتماً آسانسور داشته باشه
    semantics: Create condition -> requirement edge; do not globalize B unless explicitly global.
  exception:
    patterns:
    - '{A} بهتره ولی {B} هم قبوله'
    - '{A} ترجیح می‌دم ولی اگر {B}، مشکلی نیست'
    - '{A} می‌خوام؛ مگر اینکه {B}'
    examples:
    - نوساز بهتره ولی قدیمی بازسازی‌شده هم قبوله
    - دو خواب می‌خوام ولی اگر خیلی بزرگه یک خواب هم قبوله
    semantics: Primary preference plus controlled exception/fallback.
  conditional_relaxation:
    patterns:
    - '{A} مهم نیست اگر {B}'
    - اگر {B} باشه، {A} لازم نیست
    - '{A} رو می‌تونم بیخیال شم اگه {B}'
    examples:
    - پارکینگ مهم نیست اگر نزدیک محل کار باشه
    - متراژ کمتر اوکیه اگر مسیر خیلی کوتاه باشه
    semantics: Relax A only when B holds.
  progressive_fallback:
    patterns:
    - اول {A}، اگر نبود {B}
    - اول {A} رو بگرد؛ اگه چیزی نبود {B}
    - اگر با {A} چیزی پیدا نشد {B}
    - '{A} ترجیحیه، بعدش {B}'
    examples:
    - اول فقط ونک رو بگرد؛ اگه چیزی نبود اطرافش رو هم ببین
    - اگر با ۲۵ میلیون چیزی نبود تا ۳۰ میلیون هم برو
    - اول نوسازها؛ اگه کم بود بازسازی‌شده‌های قدیمی رو نشون بده
    semantics: Represent strict stage then relaxed stage; avoid flattening into one loose query.
  cardinality:
    patterns:
    - حداقل {n} {feature}
    - '{n} تا {feature} لازم دارم'
    - '{feature} حداقل {n} تا'
    examples:
    - حداقل دو پارکینگ
    - دو تا پارکینگ لازم دارم
  exclusion:
    patterns:
    - '{A} نباشه'
    - '{A} اصلاً نه'
    - '{A} رو نشون نده'
    - بدون {A}
    notes: 'Interpret carefully: ''بدون پارکینگ هم اوکیه'' is relaxation, not exclusion of parking.'
  allowed_set:
    patterns:
    - '{A} یا {B}'
    - '{A} تا {B}'
    - '{A} هم اوکیه'
    examples:
    - یک یا دو خوابه
    - طبقه دوم یا سوم
  additive_patch:
    patterns:
    - حالا {A} هم داشته باشه
    - '{A} رو هم اضافه کن'
    - ضمن اینکه {A}
    semantics: Add A while preserving existing SearchIntent fields.
  unset_patch:
    patterns:
    - '{A} دیگه مهم نیست'
    - '{A} رو حذف کن'
    - بیخیال {A}
    - '{A} لازم نیست'
    semantics: Unset or lower only A; preserve unrelated state.
conditional_rule_catalog:
- id: floor_requires_elevator
  example: طبقه چهار به بالا فقط اگر آسانسور داشته باشه
  if:
    floor:
      min: 4
  then:
    elevator:
      required: true
- id: old_requires_elevator
  example: نوساز ترجیح می‌دم ولی اگر قدیمیه حتما آسانسور داشته باشه
  preference:
    building_age: newer
  if:
    building_age: older
  then:
    elevator:
      required: true
- id: old_allowed_if_renovated
  example: قدیمی اشکال نداره اگر کامل بازسازی شده باشه
  if:
    building_age: older
  then:
    renovation:
      required: true
- id: parking_relaxed_if_close_to_work
  example: پارکینگ مهم نیست اگر نزدیک محل کار باشه
  if:
    commute_fit: high
  then:
    parking:
      priority: ignored
  else:
    parking:
      priority: medium
- id: budget_relaxed_if_close
  example: تا ۳۰ میلیون اجاره اوکیه ولی فقط اگر خیلی نزدیک محل کار باشه
  if:
    commute_fit: very_high
  then:
    rent:
      max: 30M
- id: smaller_allowed_if_close
  example: متراژ کمتر اوکیه اگر خیلی نزدیک محل کار باشه
  if:
    commute_fit: very_high
  then:
    area:
      relax_min: true
fallback_rule_catalog:
- id: location_exact_then_nearby
  example: اول فقط ونک رو بگرد، اگه چیزی نبود اطرافش رو هم ببین
  stage_1:
    desired_location:
      place: ونک
      mode: exact
  stage_2:
    desired_location:
      place: ونک
      mode: nearby
- id: rent_expand
  example: اگه با ۲۵ میلیون چیزی نبود تا ۳۰ میلیون هم برو
  stage_1:
    rent:
      max: 25M
  stage_2:
    rent:
      max: 30M
- id: new_then_renovated_old
  example: اول نوسازها، اگه کم بود قدیمی‌های بازسازی‌شده رو هم نشون بده
  stage_1:
    building_age:
      preference: newer
  stage_2:
    allow:
      building_age: older
    require:
      renovation: true
precedence:
- Explicit manual control/filter change > older natural-language state.
- Latest explicit natural-language request > earlier request.
- Required/hard constraint > preference when both refer to same field in same utterance.
- Explicit negation/unset > inherited positive preference.
- Structured listing fact > text-derived evidence for the same factual field.
- Conditional rule must remain conditional; do not flatten requirement globally.
- Unknown evidence does not satisfy a required text-derived criterion unless policy explicitly permits unknown.
evidence_policy:
  structured:
    usage: May be used as fact in UI and hard filtering.
    examples:
    - area
    - bedrooms
    - parking presence
    - elevator presence
    - year
    - neighborhood
  text_claim:
    usage: Use as ad evidence, not verified fact.
    ui_language_examples:
    - آگهی روی نورگیری خوب تأکید دارد
    - در متن آگهی «بازسازی کامل» ذکر شده
    - آگهی وجود نگهبانی را ذکر کرده
  unknown:
    rule: Unknown must not silently become false.
    required_behavior: For a hard requirement derived only from text evidence, decide explicitly whether UNKNOWN is excluded
      or surfaced as 'نیاز به بررسی'. Do not call it a confirmed match.
implementation_guidance:
  recommended_parse_order:
  - normalize text
  - classify NEW_SEARCH vs PATCH/CONTEXTUAL_PATCH
  - resolve contextual references
  - extract hard numeric/count/location constraints
  - extract explicit required/preferred/ignored priorities
  - extract negations/unsets
  - extract relative priorities
  - extract conditional and fallback grammar
  - merge patch using precedence rules
  - validate contradictions
  - emit compact change diff
  contradiction_examples:
  - input: پارکینگ حتماً داشته باشه ولی پارکینگ مهم نیست
    resolution: Prefer the latest/nearest explicit clause only if clause ordering is clear; otherwise mark ambiguous.
  - input: فقط ونک باشه ولی اطراف ونک هم خوبه
    resolution: Later nearby relaxation overrides exact if same utterance clearly sequences relaxation.
  safe_unknown_behavior:
  - Do not fabricate pet policy.
  - Do not fabricate parking count/type.
  - Do not fabricate bathroom count.
  - Do not fabricate wheelchair accessibility.
  - Do not fabricate exact metro walking distance.

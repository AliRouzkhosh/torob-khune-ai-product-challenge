meta:
  name: KhaneYab Persian Housing Search Phrase Bank
  version: 0.2.0
  language: fa-IR
  purpose: Expanded vocabulary for deterministic Persian housing-intent parsing. Includes colloquial forms, spelling variants,
    Tehran-market terminology, negation, intensity, and compound/fallback language.
  usage:
  - Normalize before matching.
  - Treat phrase banks as semantic families, not direct one-to-one regexes.
  - Prefer longest/specific phrase matches before shorter ambiguous tokens.
  - Do not infer listing facts from user vocabulary; user phrases describe desired intent.
  - For listing text evidence, preserve YES/NO/UNKNOWN and source wording.

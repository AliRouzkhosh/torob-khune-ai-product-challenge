meta:
  name: KhaneYab Search Language Regression Corpus
  version: 0.2.0
  language: fa-IR
  spec_file: SEARCH_LANGUAGE_SPEC.yaml
  notes:
  - 'Expected values are intentionally partial: unspecified SearchIntent fields should not be asserted.'
  - PATCH cases must preserve unrelated initial_state fields.
  - Text-evidence requirements must respect UNKNOWN != false.
  - This corpus is designed to grow as real user phrases are discovered.
  - v0.2 expands coverage to colloquial forms, spelling variants, Tehran-market terminology, and hard compound cases.
  phrase_bank_file: SEARCH_LANGUAGE_PHRASE_BANK.yaml
  case_count: 320

{% load static %}<div class="listing-image">{% if item.image %}<img src="{{ item.image }}" alt="تصویر نمایشی برای {{ item.listing.title }}؛ عکس این آگهی نیست" width="480" height="240" loading="{{ image_loading|default:'lazy' }}" decoding="async">{% else %}<img src="{% static 'finder/placeholder.svg' %}" alt="" width="480" height="240"><span class="image-caption">جای تصویر خانه</span>{% endif %}</div>

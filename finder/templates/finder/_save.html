<form method="post" action="{% url 'save_toggle' %}" class="save-form" data-save-form data-listing="{{ item.listing.id }}">{% csrf_token %}<input type="hidden" name="return" value="{{ current_page }}"><button class="save-button" type="submit" name="listing" value="{{ item.listing.id }}" aria-pressed="{{ item.saved|yesno:'true,false' }}" aria-label="{% if item.saved %}حذف از ذخیره‌ها{% else %}ذخیره خانه{% endif %}" data-title="{{ item.listing.title }}"><svg class="bookmark-icon" aria-hidden="true" viewBox="0 0 24 24" fill="{% if item.saved %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button></form>
